<!DOCTYPE html>
<html>
  <head>
    <title>AI Image Site</title>
    <script>
      async function generateImage(event) {
        event.preventDefault();
        const prompt = document.getElementById('prompt').value;
        const result = document.getElementById('result');
        result.innerHTML = '⏳ Attendi, sto generando...';

        try {
          const res = await fetch('/api/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt })
          });

          const data = await res.json();

          if (data.url) {
            result.innerHTML = `<img src="${data.url}" style="max-width:100%; margin-top:20px;" />`;
          } else {
            result.innerHTML = '❌ Errore: ' + (data.error || 'impossibile generare l’immagine');
          }
        } catch (err) {
          result.innerHTML = '❌ Errore: ' + err.message;
        }
      }
    </script>
  </head>
  <body>
    <h2>Genera un'immagine con ChatGPT</h2>
    <form onsubmit="generateImage(event)">
      <input type="text" id="prompt" placeholder="Scrivi cosa vuoi generare..." required />
      <button type="submit">Genera</button>
    </form>
    <div id="result" style="margin-top: 20px;"></div>
  </body>
</html>
