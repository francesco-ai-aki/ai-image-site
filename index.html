<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Generatore di Immagini AI</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; }
    input, button { padding: 10px; font-size: 16px; margin-top: 10px; }
    img { margin-top: 20px; max-width: 100%; }
  </style>
</head>
<body>
  <h1>Genera un'immagine con ChatGPT</h1>
  <input type="text" id="prompt" placeholder="Scrivi cosa vuoi generare..." />
  <button onclick="generateImage()">Genera</button>
  <div id="result"></div>

  <script>
    async function generateImage() {
      const prompt = document.getElementById('prompt').value;
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = '⏳ Generazione in corso...';

      try {
        const response = await fetch("https://api.openai.com/v1/images/generations", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer TUO_API_KEY"
          },
          body: JSON.stringify({
            prompt: prompt,
            n: 1,
            size: "512x512"
          })
        });

        const data = await response.json();
        const imageUrl = data.data[0].url;
        resultDiv.innerHTML = `<img src="${imageUrl}" alt="Risultato generato" />`;

      } catch (error) {
        resultDiv.innerHTML = "❌ Errore nella generazione.";
        console.error(error);
      }
    }
  </script>
</body>
</html>
